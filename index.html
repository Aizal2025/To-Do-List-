<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- FRONT PAGE -->
    <section class="front-page" id="frontPage">
        <div class="front-content">
            <div class="front-image">
                <div class="card">
                    <div class="card-row"><span class="dot done">✔</span><span class="line"></span></div>
                    <div class="card-row"><span class="dot done">✔</span><span class="line short"></span></div>
                    <div class="card-row"><span class="dot"></span><span class="line light"></span></div>
                </div>
            </div>
            <h1 class="front-title">TO-DO-LIST<br>WEB-APP</h1>
            <p class="front-text">Plan your day, crush your tasks and stay locked in. Simple, fast and stress-free productivity.</p>
            <button id="startBtn" class="start-btn">Get Started &rarr;</button>
        </div>

        <footer class="footer">
            <p>Made by Ziya Khan | &copy; 2026 All Rights Reserved</p>
        </footer>
    </section>

    <!-- TO DO APP -->
    <div class="app-page hidden" id="appPage">
    <div class="container">
        <h1>TO-DO-LIST<br>WEB-APP</h1>
        <p class="subtitle">Task Organiser</p>
        <div class="tabs">
            <span>TOTAL:<b id="totalCount">0</b></span>
            <span>PENDING:<b id="totalPending">0</b></span>
            <span>COMPLETE:<b id="totalCompleted">0</b></span>
        </div>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="100">
            <button id="addBtn">+</button>
        </div>

        <p class="error-msg" id="errorMsg">Please enter a task before adding</p>
        <div class="filter-tabs">
            <button class="activeBtn active" data-filter="all">All</button>
            <button class="activeBtn" data-filter="pending">Pending</button>
            <button class="activeBtn" data-filter="completed">Completed</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
